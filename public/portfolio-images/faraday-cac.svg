<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F0F4FF"/>

  <!-- Funnel shape - wide top -->
  <polygon points="150,80 1050,80 780,315 420,315" fill="#2D3A8C" opacity="0.07"/>

  <!-- Funnel shape - mid -->
  <polygon points="420,315 780,315 680,450 520,450" fill="#2D3A8C" opacity="0.10"/>

  <!-- Funnel shape - narrow bottom -->
  <polygon points="520,450 680,450 630,560 570,560" fill="#2D3A8C" opacity="0.14"/>

  <!-- Funnel border lines -->
  <line x1="150" y1="80" x2="420" y2="315" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>
  <line x1="1050" y1="80" x2="780" y2="315" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>
  <line x1="420" y1="315" x2="520" y2="450" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>
  <line x1="780" y1="315" x2="680" y2="450" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>
  <line x1="520" y1="450" x2="570" y2="560" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>
  <line x1="680" y1="450" x2="630" y2="560" stroke="#2D3A8C" stroke-width="2.5" opacity="0.3"/>

  <!-- Leak dots escaping the funnel - left side (users leaving) -->
  <circle cx="300" cy="200" r="8"  fill="#E8562A" opacity="0.5"/>
  <circle cx="240" cy="260" r="6"  fill="#E8562A" opacity="0.4"/>
  <circle cx="190" cy="180" r="10" fill="#E8562A" opacity="0.35"/>
  <circle cx="350" cy="290" r="7"  fill="#E8562A" opacity="0.45"/>
  <circle cx="420" cy="370" r="6"  fill="#E8562A" opacity="0.4"/>
  <circle cx="380" cy="410" r="8"  fill="#E8562A" opacity="0.35"/>

  <!-- Leak dots - right side -->
  <circle cx="900" cy="200" r="9"  fill="#E8562A" opacity="0.5"/>
  <circle cx="960" cy="260" r="6"  fill="#E8562A" opacity="0.4"/>
  <circle cx="870" cy="170" r="7"  fill="#E8562A" opacity="0.35"/>
  <circle cx="850" cy="290" r="8"  fill="#E8562A" opacity="0.45"/>
  <circle cx="790" cy="380" r="6"  fill="#E8562A" opacity="0.4"/>

  <!-- Dots flowing through funnel (successes) -->
  <circle cx="600" cy="160" r="10" fill="#2D3A8C" opacity="0.5"/>
  <circle cx="550" cy="200" r="8"  fill="#2D3A8C" opacity="0.45"/>
  <circle cx="650" cy="220" r="9"  fill="#2D3A8C" opacity="0.45"/>
  <circle cx="590" cy="370" r="8"  fill="#2D3A8C" opacity="0.5"/>
  <circle cx="610" cy="490" r="7"  fill="#2D3A8C" opacity="0.55"/>

  <!-- Bottom output glow -->
  <circle cx="600" cy="590" r="40" fill="#2D3A8C" opacity="0.12"/>
  <circle cx="600" cy="590" r="25" fill="#2D3A8C" opacity="0.25"/>
  <circle cx="600" cy="590" r="12" fill="#2D3A8C"/>
</svg>
